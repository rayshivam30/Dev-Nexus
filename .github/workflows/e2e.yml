name: End-to-End Tests
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incident-management-system
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devnexus
          POSTGRES_PASSWORD: devnexus
          POSTGRES_DB: devnexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devnexus -d devnexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
    env:
      DATABASE_URL: postgresql://devnexus:devnexus@localhost:5432/devnexus_test
      JWT_SECRET: devnexus-e2e-jwt-secret-at-least-32-characters
      DEVNEXUS_E2E_FAKE_AI: "true"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      METRICS_BEARER_TOKEN: e2e-metrics-placeholder
      GITHUB_WEBHOOK_SECRET: e2e-github-placeholder
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply database migrations
        run: bunx prisma migrate deploy
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Wait for local SMTP sink
        run: |
          for attempt in {1..30}; do
            nc -z 127.0.0.1 1025 && exit 0
            sleep 1
          done
          echo "Mailpit SMTP port did not become ready" >&2
          exit 1
      - name: Start durable job worker
        run: |
          bun run src/worker.ts > /tmp/devnexus-worker.log 2>&1 &
          echo $! > /tmp/devnexus-worker.pid
      - name: Run E2E tests
        run: bun run test:e2e
      - name: Stop durable job worker
        if: always()
        run: |
          if [ -f /tmp/devnexus-worker.pid ]; then
            kill "$(cat /tmp/devnexus-worker.pid)" || true
          fi
          if [ -f /tmp/devnexus-worker.log ]; then
            cat /tmp/devnexus-worker.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: incident-management-system/playwright-report/
          retention-days: 30
