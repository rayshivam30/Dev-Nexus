# ─────────────────────────────────────────────────────────────────────────────
# DevNexus — Docker Compose (Fully Local Development & Production Stack)
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d --build      # Build & start all services locally
#   docker compose logs -f            # Tail logs for all services
#   docker compose logs -f worker     # Tail worker logs (emails, AI, queues)
#   docker compose down -v            # Stop & remove volumes
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: devnexus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: devnexus
      POSTGRES_USER: devnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devnexus -d devnexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnexus-network

  # ── Database Migrations (init container) ──────────────────────────────────
  migrations:
    build:
      context: ./incident-management-system
      dockerfile: Dockerfile
      target: deps
    container_name: devnexus-migrations
    command: bun x prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://devnexus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/devnexus?connect_timeout=30
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devnexus-network

  # ── Redis (Local In-Memory Cache & Distributed Store) ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: devnexus-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devnexus-network

  # ── Upstash-Compatible HTTP Proxy for Local Redis ─────────────────────────
  # Exposes an HTTP REST interface allowing @upstash/redis to run locally without cloud.
  redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: devnexus-redis-http
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: "devnexus_local_redis_token"
      SRH_CONNECTION_STRING: "redis://redis:6379"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - devnexus-network

  # ── Mailpit (Local SMTP Server & Webmail UI) ──────────────────────────────
  # Captures all outgoing emails locally. View inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: devnexus-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # Webmail UI
      - "127.0.0.1:1025:1025" # SMTP port
    networks:
      - devnexus-network

  # ── DevNexus Application ──────────────────────────────────────────────────
  app:
    build:
      context: ./incident-management-system
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_GITHUB_APP_SLUG:-}
    container_name: devnexus-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./incident-management-system/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://devnexus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/devnexus?connect_timeout=30&connection_limit=10&pool_timeout=30
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_VERIFY_ON_STARTUP: ${SMTP_VERIFY_ON_STARTUP:-false}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_GITHUB_APP_SLUG:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-http://redis-http:80}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-devnexus_local_redis_token}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN must be set}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-http:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - devnexus-network

  # ── Background Worker (AI, SLA, Email Durable Queues) ────────────────────
  worker:
    build:
      context: ./incident-management-system
      dockerfile: Dockerfile
      target: worker
    container_name: devnexus-worker
    restart: unless-stopped
    command: ["bun", "run", "src/worker.ts"]
    env_file:
      - ./incident-management-system/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://devnexus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/devnexus?connect_timeout=30&connection_limit=10&pool_timeout=30
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-http://redis-http:80}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-devnexus_local_redis_token}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN must be set}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-http:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - devnexus-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  devnexus-network:
    driver: bridge
