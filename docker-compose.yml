# ─────────────────────────────────────────────────────────────────────────────
# DevNexus — Docker Compose (Local Development & Testing)
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d              # Start everything
#   docker compose up -d --build      # Rebuild & start
#   docker compose logs -f app        # Tail app logs
#   docker compose down -v            # Stop & remove volumes
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: devnexus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: devnexus
      POSTGRES_USER: devnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devnexus_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devnexus -d devnexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnexus-network

  # ── Redis (Rate Limiting & Event Bridge) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devnexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnexus-network

  # ── Database Migrations (init container) ──────────────────────────────────
  migrations:
    build:
      context: ./incident-management-system
      dockerfile: Dockerfile
      target: deps
    container_name: devnexus-migrations
    command: bun x prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://devnexus:${POSTGRES_PASSWORD:-devnexus_secret}@postgres:5432/devnexus?connect_timeout=30
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devnexus-network

  # ── DevNexus Application ─────────────────────────────────────────────────
  app:
    build:
      context: ./incident-management-system
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_GITHUB_APP_SLUG:-}
    container_name: devnexus-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./incident-management-system/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://devnexus:${POSTGRES_PASSWORD:-devnexus_secret}@postgres:5432/devnexus?connect_timeout=30&connection_limit=10&pool_timeout=30
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_GITHUB_APP_SLUG:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - devnexus-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  devnexus-network:
    driver: bridge
