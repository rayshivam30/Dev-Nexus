# ─────────────────────────────────────────────────────────────────────────────
# DevNexus — Docker Compose (Local Development & Testing)
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d              # Start everything
#   docker compose up -d --build      # Rebuild & start
#   docker compose logs -f app        # Tail app logs
#   docker compose down -v            # Stop & remove volumes
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: devnexus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: devnexus
      POSTGRES_USER: devnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devnexus -d devnexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnexus-network

  # ── Database Migrations (init container) ──────────────────────────────────
  migrations:
    build:
      context: ./incident-management-system
      dockerfile: Dockerfile
      target: deps
    container_name: devnexus-migrations
    command: bun x prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://devnexus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/devnexus?connect_timeout=30
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devnexus-network

  # ── DevNexus Application ─────────────────────────────────────────────────
  app:
    build:
      context: ./incident-management-system
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_GITHUB_APP_SLUG:-}
    container_name: devnexus-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./incident-management-system/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://devnexus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/devnexus?connect_timeout=30&connection_limit=10&pool_timeout=30
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_VERIFY_ON_STARTUP: ${SMTP_VERIFY_ON_STARTUP:-false}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_GITHUB_APP_SLUG:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?UPSTASH_REDIS_REST_URL must be set}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?UPSTASH_REDIS_REST_TOKEN must be set}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN must be set}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - devnexus-network

  # Durable AI, SLA, and email queues are polled by a dedicated process.
  worker:
    build:
      context: ./incident-management-system
      dockerfile: Dockerfile
    container_name: devnexus-worker
    restart: unless-stopped
    command: ["bun", "run", "src/worker.ts"]
    env_file:
      - ./incident-management-system/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://devnexus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/devnexus?connect_timeout=30&connection_limit=10&pool_timeout=30
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?UPSTASH_REDIS_REST_URL must be set}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?UPSTASH_REDIS_REST_TOKEN must be set}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN must be set}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - devnexus-network

volumes:
  postgres_data:
    driver: local

networks:
  devnexus-network:
    driver: bridge
